buildscript {
    repositories { mavenCentral(); maven { name = 'forge'; url = 'https://maven.minecraftforge.net' } }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = 'link.e4steam'
archivesBaseName = 'e4steam-forge-mc1.8.9'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}
repositories { mavenCentral() }
configurations { embed }
dependencies {
    embed('com.code-disaster.steamworks4j:steamworks4j:1.10.0') { transitive = false }
    embed 'net.java.dev.jna:jna:5.10.0'
    compile configurations.embed
}

def repositoryRoot = project.hasProperty('e4steamRoot') ? file(project.property('e4steamRoot')) : file('../..')
def sharedRoot = new File(repositoryRoot, 'common/src/main/java')
def generatedCore = file("$buildDir/generated/sources/e4steamJava8")
task prepareJava8Core(type: Sync) {
    from(new File(sharedRoot, 'link/e4steam/HexCodec.java')) { into 'link/e4steam' }
    from(new File(sharedRoot, 'link/e4steam/steam')) { into 'link/e4steam/steam'; exclude 'SteamSession.java' }
    from(new File(repositoryRoot, 'legacy-java8/mc1.16.5-forge/src/main/java/link/e4steam/steam/SteamSession.java')) { into 'link/e4steam/steam' }
    into generatedCore
}
sourceSets.main.java.srcDir generatedCore
compileJava.dependsOn prepareJava8Core
compileJava.options.encoding = 'UTF-8'
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand version: project.version }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar {
    from(new File(repositoryRoot, 'LICENSE')) { into 'META-INF'; rename { 'LICENSE-e4steam.txt' } }
    from(new File(repositoryRoot, 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
    from(new File(repositoryRoot, 'NOTICE')) { into 'META-INF'; rename { 'NOTICE-e4steam.txt' } }
    from(new File(repositoryRoot, 'common/src/main/resources/assets')) { into 'assets' }
    from { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
reobf { jar {} }
