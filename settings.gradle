pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

include("api", "api-testkit", "example-addon", "common")
// The optional local Unix overlay helper is not part of the mod source distribution.
if (file("stdin-agent").isDirectory()) include("stdin-agent")
providers.gradleProperty("enabled_platforms")
        .getOrElse("fabric,forge,neoforge")
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .each { include(it) }

rootProject.name = "e4steam"
